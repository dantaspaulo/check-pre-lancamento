<svg xmlns="http://www.w3.org/2000/svg" width="420" height="400" viewBox="0 0 420 400" role="img" aria-label="Como funciona: Varredura, Revisão, Relatório, Correção">
<title>Como funciona: Varredura, Revisão, Relatório, Correção</title>
<!-- check-pre-lancamento · Paulo Sérgio Dantas · github.com/dantaspaulo/check-pre-lancamento -->
<style>
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.run{stroke-dasharray:9 91;animation:run 7s linear infinite}
@keyframes run{to{stroke-dashoffset:-100}}
.shine{animation:shine 8s ease-in-out infinite}
@keyframes shine{0%,72%{transform:translateX(-420px)}100%{transform:translateX(1300px)}}
.ok{stroke-dasharray:24;animation:ok .5s ease both}
@keyframes ok{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
.nb{font:800 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#04140A}
.it{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#EAFBEF}
.hd{font:700 11px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1.6px;fill:#2BFA59}
.nn{font:400 46px Georgia,'Times New Roman',serif;fill:url(#g)}
.nl{font:500 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#C2DCCB}
.mk{font:400 20px Georgia,'Times New Roman',serif;fill:#2BFA59}
.mt{font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#EAFBEF}
.ms{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8FB09B}
@keyframes fe0{0%,0%{fill:#0B110D;stroke:#2B4A36}3%,90%{fill:#0F2A18;stroke:#2BFA59}100%{fill:#0B110D;stroke:#2B4A36}}.fe0{animation:fe0 9s ease infinite}@keyframes fe1{0%,24%{fill:#0B110D;stroke:#2B4A36}28%,90%{fill:#0F2A18;stroke:#2BFA59}100%{fill:#0B110D;stroke:#2B4A36}}.fe1{animation:fe1 9s ease infinite}@keyframes fe2{0%,49%{fill:#0B110D;stroke:#2B4A36}53%,90%{fill:#0F2A18;stroke:#2BFA59}100%{fill:#0B110D;stroke:#2B4A36}}.fe2{animation:fe2 9s ease infinite}@keyframes fe3{0%,74%{fill:#0B110D;stroke:#2B4A36}78%,90%{fill:#0F2A18;stroke:#2BFA59}100%{fill:#0B110D;stroke:#2B4A36}}.fe3{animation:fe3 9s ease infinite}.tr{stroke-dasharray:100;stroke-dashoffset:100;animation:tr 9s ease-in-out infinite}@keyframes tr{0%{stroke-dashoffset:100;opacity:1}75%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}.pt{animation:pt 9s ease-in-out infinite}@keyframes pt{0%{transform:translateY(0);opacity:1}75%{transform:translateY(276.0px);opacity:1}92%{opacity:0}100%{transform:translateY(0);opacity:0}}</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8CFFA8"/><stop offset="1" stop-color="#13A83C"/></linearGradient><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#D6FFE2" stop-opacity="0"/><stop offset=".5" stop-color="#D6FFE2" stop-opacity=".08"/><stop offset="1" stop-color="#D6FFE2" stop-opacity="0"/></linearGradient></defs>
<rect x="1" y="1" width="418" height="398" rx="18" fill="#0B110D" stroke="#1F3326"/><clipPath id="cflc"><rect x="1" y="1" width="418" height="398" rx="18"/></clipPath><g clip-path="url(#cflc)"><g class="shine"><rect x="0" y="-20" width="150" height="440" fill="url(#sh)" transform="skewX(-18)"/></g></g><rect class="run" x="1" y="1" width="418" height="398" rx="18" fill="none" stroke="url(#g)" stroke-width="1.6" pathLength="100"/><line x1="56" y1="62" x2="56" y2="338" stroke="#1F3326" stroke-width="2"/><line class="tr" x1="56" y1="62" x2="56" y2="338" stroke="#2BFA59" stroke-width="2.4" pathLength="100"/><circle class="fe0" cx="56" cy="62" r="22" fill="#0B110D" stroke="#2B4A36" stroke-width="1.6"/><text class="mk" x="56" y="69" text-anchor="middle">1</text><g class="up" style="animation-delay:0.15s"><text class="mt" x="96" y="58">Varredura</text><text class="ms" x="96" y="78">scanner lê o código, o git e o site no ar</text></g><circle class="fe1" cx="56" cy="154" r="22" fill="#0B110D" stroke="#2B4A36" stroke-width="1.6"/><text class="mk" x="56" y="161" text-anchor="middle">2</text><g class="up" style="animation-delay:0.30s"><text class="mt" x="96" y="150">Revisão</text><text class="ms" x="96" y="170">o agente confirma cada achado rota a rota</text></g><circle class="fe2" cx="56" cy="246" r="22" fill="#0B110D" stroke="#2B4A36" stroke-width="1.6"/><text class="mk" x="56" y="253" text-anchor="middle">3</text><g class="up" style="animation-delay:0.45s"><text class="mt" x="96" y="242">Relatório</text><text class="ms" x="96" y="262">veredito, notas e evidência com arquivo:linha</text></g><circle class="fe3" cx="56" cy="338" r="22" fill="#0B110D" stroke="#2B4A36" stroke-width="1.6"/><text class="mk" x="56" y="345" text-anchor="middle">4</text><g class="up" style="animation-delay:0.60s"><text class="mt" x="96" y="334">Correção</text><text class="ms" x="96" y="354">prompts prontos, uma task por vez, com commit</text></g><circle class="pt" cx="56" cy="62" r="5" fill="#8CFFA8"/>
</svg>
