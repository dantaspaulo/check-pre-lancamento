<svg xmlns="http://www.w3.org/2000/svg" width="860" height="196" viewBox="0 0 860 196" role="img" aria-label="Como funciona: Varredura, Revisão, Relatório, Correção">
<title>Como funciona: Varredura, Revisão, Relatório, Correção</title>
<!-- check-pre-lancamento · Paulo Sérgio Dantas · github.com/dantaspaulo/check-pre-lancamento -->
<style>
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.run{stroke-dasharray:9 91;animation:run 7s linear infinite}
@keyframes run{to{stroke-dashoffset:-100}}
.shine{animation:shine 8s ease-in-out infinite}
@keyframes shine{0%,72%{transform:translateX(-420px)}100%{transform:translateX(1300px)}}
.ok{stroke-dasharray:24;animation:ok .5s ease both}
@keyframes ok{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
.nb{font:800 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#04140A}
.it{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#EAFBEF}
.hd{font:700 11px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1.6px;fill:#2BFA59}
.nn{font:400 46px Georgia,'Times New Roman',serif;fill:url(#g)}
.nl{font:500 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#C2DCCB}
.mk{font:400 20px Georgia,'Times New Roman',serif;fill:#2BFA59}
.mt{font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#EAFBEF}
.ms{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8FB09B}
@keyframes fd0{0%,0%{fill:#0B110D;stroke:#2B4A36}3%,90%{fill:#0F2A18;stroke:#2BFA59}100%{fill:#0B110D;stroke:#2B4A36}}.fd0{animation:fd0 9s ease infinite}@keyframes fd1{0%,24%{fill:#0B110D;stroke:#2B4A36}28%,90%{fill:#0F2A18;stroke:#2BFA59}100%{fill:#0B110D;stroke:#2B4A36}}.fd1{animation:fd1 9s ease infinite}@keyframes fd2{0%,49%{fill:#0B110D;stroke:#2B4A36}53%,90%{fill:#0F2A18;stroke:#2BFA59}100%{fill:#0B110D;stroke:#2B4A36}}.fd2{animation:fd2 9s ease infinite}@keyframes fd3{0%,74%{fill:#0B110D;stroke:#2B4A36}78%,90%{fill:#0F2A18;stroke:#2BFA59}100%{fill:#0B110D;stroke:#2B4A36}}.fd3{animation:fd3 9s ease infinite}.tr{stroke-dasharray:100;stroke-dashoffset:100;animation:tr 9s ease-in-out infinite}@keyframes tr{0%{stroke-dashoffset:100;opacity:1}75%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}.pt{animation:pt 9s ease-in-out infinite}@keyframes pt{0%{transform:translateX(0);opacity:1}75%{transform:translateX(645.0px);opacity:1}92%{opacity:0}100%{transform:translateX(0);opacity:0}}</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8CFFA8"/><stop offset="1" stop-color="#13A83C"/></linearGradient><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#D6FFE2" stop-opacity="0"/><stop offset=".5" stop-color="#D6FFE2" stop-opacity=".08"/><stop offset="1" stop-color="#D6FFE2" stop-opacity="0"/></linearGradient></defs>
<rect x="1" y="1" width="858" height="194" rx="18" fill="#0B110D" stroke="#1F3326"/><clipPath id="cflu"><rect x="1" y="1" width="858" height="194" rx="18"/></clipPath><g clip-path="url(#cflu)"><g class="shine"><rect x="0" y="-20" width="150" height="236" fill="url(#sh)" transform="skewX(-18)"/></g></g><rect class="run" x="1" y="1" width="858" height="194" rx="18" fill="none" stroke="url(#g)" stroke-width="1.6" pathLength="100"/><line x1="107.5" y1="62" x2="752.5" y2="62" stroke="#1F3326" stroke-width="2"/><line class="tr" x1="107.5" y1="62" x2="752.5" y2="62" stroke="#2BFA59" stroke-width="2.4" pathLength="100"/><circle class="fd0" cx="107.5" cy="62" r="22" fill="#0B110D" stroke="#2B4A36" stroke-width="1.6"/><text class="mk" x="107.5" y="69" text-anchor="middle">1</text><g class="up" style="animation-delay:0.15s"><text class="mt" x="107.5" y="120" text-anchor="middle">Varredura</text><text class="ms" x="107.5" y="143" text-anchor="middle">scanner lê o código,</text><text class="ms" x="107.5" y="161" text-anchor="middle">o git e o site no ar</text></g><circle class="fd1" cx="322.5" cy="62" r="22" fill="#0B110D" stroke="#2B4A36" stroke-width="1.6"/><text class="mk" x="322.5" y="69" text-anchor="middle">2</text><g class="up" style="animation-delay:0.30s"><text class="mt" x="322.5" y="120" text-anchor="middle">Revisão</text><text class="ms" x="322.5" y="143" text-anchor="middle">o agente confirma cada</text><text class="ms" x="322.5" y="161" text-anchor="middle">achado rota a rota</text></g><circle class="fd2" cx="537.5" cy="62" r="22" fill="#0B110D" stroke="#2B4A36" stroke-width="1.6"/><text class="mk" x="537.5" y="69" text-anchor="middle">3</text><g class="up" style="animation-delay:0.45s"><text class="mt" x="537.5" y="120" text-anchor="middle">Relatório</text><text class="ms" x="537.5" y="143" text-anchor="middle">veredito, notas e</text><text class="ms" x="537.5" y="161" text-anchor="middle">evidência com arquivo:linha</text></g><circle class="fd3" cx="752.5" cy="62" r="22" fill="#0B110D" stroke="#2B4A36" stroke-width="1.6"/><text class="mk" x="752.5" y="69" text-anchor="middle">4</text><g class="up" style="animation-delay:0.60s"><text class="mt" x="752.5" y="120" text-anchor="middle">Correção</text><text class="ms" x="752.5" y="143" text-anchor="middle">prompts prontos, uma</text><text class="ms" x="752.5" y="161" text-anchor="middle">task por vez, com commit</text></g><circle class="pt" cx="107.5" cy="62" r="5" fill="#8CFFA8"/>
</svg>
